    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>端口状态 - Hermes Dashboard Lite (Demo)</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/console-v31.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/sse-components.css">

    <style>
        html, body { margin: 0; padding: 0; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; }
        .top-navbar { background: rgba(15, 23, 42, 0.95); }
        .nav-item.active { color: #ffffff !important; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); }
    </style>

<body>
    <nav class="top-navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-brand">
                <span class="logo-icon">🚀</span>
                <span class="logo-text">Hermes</span>
                <span class="version">v3.0 · public demo</span>
            </a>
            <div class="navbar-menu">
                <a href="index.html" class="nav-item active"><span class="icon">&#x1F5A5;</span><span>端口状态</span></a>
                <a href="agents.html" class="nav-item"><span class="icon">&#x1F916;</span><span>Agent</span></a>
                <a href="tasks.html" class="nav-item"><span class="icon">&#x23F0;</span><span>定时任务</span></a>
                <a href="skills.html" class="nav-item"><span class="icon">&#x26A1;</span><span>技能</span></a>
                <a href="pipeline.html" class="nav-item"><span class="icon">&#x1F9ED;</span><span>流水线</span></a>
                <a href="token.html" class="nav-item"><span class="icon">&#x1FA99;</span><span>Token</span></a>
                <a href="memory.html" class="nav-item"><span class="icon">&#x1F9E0;</span><span>记忆图谱</span></a>
            </div>
            <div class="navbar-actions">
                <button class="search-trigger" onclick="alert('🔒 Demo 模式\n\n全局搜索在静态演示版中不可用。')"><span>🔍</span><span>搜索...</span><kbd>⌘K</kbd></button>
                <button class="bookmark-btn" onclick="toggleBookmark()" title="收藏页面">⭐</button>
                <button class="mobile-menu-btn" onclick="toggleMobileMenu()"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <div class="container page-content">
        <header class="header">
            <h1>端口状态</h1>
            <p class="subtitle">服务端口监控 · 运行状态实时查看</p>
            <div class="header-actions">
                <span class="status-badge" id="systemHealth">
                    <span class="status-dot"></span>
                    <span id="healthText">检查中...</span>
                </span>
                <span class="current-time" id="currentTime"></span>
                <button class="btn btn-primary refresh-data-btn" onclick="app.refreshAll()">
                    刷新数据
                </button>
            </div>
        </header>

        <section class="section">
            <h2 class="section-title">&#x1F5A5;&#xFE0F; 服务状态</h2>
            <div class="services-grid" id="servicesGrid">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <div>加载中...</div>
                </div>
            </div>
        </section>
    </div>

    <div class="toast" id="toast"><span class="toast-message" id="toastMessage"></span></div>

    <script src="sample-data.js"></script>
    <script src="js/app.js"></script>
