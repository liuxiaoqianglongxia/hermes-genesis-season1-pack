<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记忆图谱 - Hermes Dashboard Lite (Demo)</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/console-v31.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/transitions.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        html, body { margin: 0; padding: 0; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; }
        .top-navbar { background: rgba(15, 23, 42, 0.95); }
        .nav-item.active { color: #ffffff !important; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); }

        .graph-container { width: 100%; height: calc(100vh - 140px); background: var(--bg-primary); border-radius: var(--border-radius); border: 1px solid var(--border-color); overflow: hidden; position: relative; }
    </style>
</head>
<body>
    <nav class="top-navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-brand">
                <span class="logo-icon">🚀</span><span class="logo-text">Hermes</span><span class="version">v3.0 · public demo</span>
            </a>
            <div class="navbar-menu">
                <a href="index.html" class="nav-item"><span class="icon">&#x1F5A5;</span><span>端口状态</span></a>
                <a href="agents.html" class="nav-item"><span class="icon">&#x1F916;</span><span>Agent</span></a>
                <a href="tasks.html" class="nav-item"><span class="icon">&#x23F0;</span><span>定时任务</span></a>
                <a href="skills.html" class="nav-item"><span class="icon">&#x26A1;</span><span>技能</span></a>
                <a href="pipeline.html" class="nav-item"><span class="icon">&#x1F9ED;</span><span>流水线</span></a>
                <a href="token.html" class="nav-item"><span class="icon">&#x1FA99;</span><span>Token</span></a>
                <a href="memory.html" class="nav-item active"><span class="icon">&#x1F9E0;</span><span>记忆图谱</span></a>
            </div>
            <div class="navbar-actions">
                <button class="search-trigger" onclick="alert('🔒 Demo 模式')"><span>🔍</span><span>搜索...</span><kbd>⌘K</kbd></button>
                <button class="bookmark-btn" onclick="toggleBookmark()" title="收藏页面">⭐</button>
                <button class="mobile-menu-btn" onclick="toggleMobileMenu()"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <div class="container page-content">
        <header class="header">
            <h1>记忆知识图谱</h1>
            <p class="subtitle">可视化查看 fact_store 记忆网络</p>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="app.refreshAll()">刷新图谱</button>
            </div>
        </header>

        <div class="graph-container" id="graphContainer">
            <div class="graph-loading" id="graphLoading">
                <div class="spinner"></div>
                <p>正在加载记忆图谱…</p>
            </div>
            <div class="graph-error" id="graphError">
                <div class="error-icon">🔌</div>
                <div class="error-title">记忆图谱服务未就绪</div>
                <div class="error-detail" id="errorMessage"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"><span class="toast-message" id="toastMessage"></span></div>

    <script src="sample-data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
