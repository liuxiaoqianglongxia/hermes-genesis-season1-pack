<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token 统计 - Hermes Dashboard Lite (Demo)</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/console-v31.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/transitions.css">
    <style>
        html, body { margin: 0; padding: 0; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; }
        .top-navbar { background: rgba(15, 23, 42, 0.95); }
        .nav-item.active { color: #ffffff !important; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); }

        .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 32px; }
        @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }

        .stat-card { position: relative; background: rgba(30, 41, 59, 0.55); border: 1px solid rgba(51, 65, 85, 0.7); border-radius: 14px; padding: 18px 16px 14px; transition: all 0.25s ease; overflow: hidden; backdrop-filter: blur(10px); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2); }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.4), transparent); }
        .stat-card:hover { transform: translateY(-4px); border-color: rgba(99, 102, 241, 0.5); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35); }
        .stat-card .stat-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; margin-bottom: 12px; background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.15); }
        .stat-card .stat-label { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 500; }
        .stat-card .stat-value { font-size: 1.6rem; font-weight: 700; line-height: 1.15; font-family: 'Fira Code', monospace; }

        .stat-card.highlight-primary { background: linear-gradient(135deg, rgba(99, 102, 241, 0.12) 0%, rgba(30, 41, 59, 0.45) 100%); border-color: rgba(99, 102, 241, 0.35); }
        .stat-card.highlight-primary .stat-icon { background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(139, 92, 246, 0.2)); }
        .stat-card.highlight-primary .stat-value { background: linear-gradient(135deg, #a5b4fc, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .stat-card.accent-green .stat-icon { background: rgba(16, 185, 129, 0.12); border-color: rgba(16, 185, 129, 0.2); }
        .stat-card.accent-green .stat-value { color: #6ee7b7; }
        .stat-card.accent-orange .stat-icon { background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.2); }
        .stat-card.accent-orange .stat-value { color: #fbbf24; }
        .stat-card.accent-blue .stat-icon { background: rgba(59, 130, 246, 0.12); border-color: rgba(59, 130, 246, 0.2); }
        .stat-card.accent-blue .stat-value { color: #93c5fd; }
        .stat-card.accent-purple .stat-icon { background: rgba(139, 92, 246, 0.12); border-color: rgba(139, 92, 246, 0.2); }
        .stat-card.accent-purple .stat-value { color: #c4b5fd; }

        .charts-row { display: grid; grid-template-columns: 1fr 380px; gap: 20px; margin-bottom: 28px; }
        @media (max-width: 900px) { .charts-row { grid-template-columns: 1fr; } }
        .chart-panel { background: rgba(30, 41, 59, 0.45); border: 1px solid rgba(51, 65, 85, 0.6); border-radius: 16px; padding: 22px 20px; backdrop-filter: blur(6px); }
        .chart-panel .panel-title { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 18px; display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: 0.3px; }
        .chart-panel .panel-title .title-icon { width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; background: rgba(99, 102, 241, 0.12); }

        .model-list { display: flex; flex-direction: column; gap: 14px; }
        .model-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; transition: background 0.2s ease; }
        .model-item:hover { background: rgba(51, 65, 85, 0.3); }
        .model-color { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
        .model-info { flex: 1; min-width: 0; }
        .model-name { font-size: 0.82rem; color: var(--text-primary); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .model-bar-bg { height: 6px; background: rgba(51, 65, 85, 0.5); border-radius: 3px; margin-top: 5px; overflow: hidden; }
        .model-bar { height: 100%; border-radius: 3px; transition: width 0.8s ease; }
        .model-tokens { font-size: 0.78rem; color: var(--text-muted); text-align: right; min-width: 72px; font-family: 'Fira Code', monospace; line-height: 1.4; }
        .model-pct { font-size: 0.7rem; color: var(--text-muted); }

        .tasks-table { width: 100%; border-collapse: collapse; }
        .tasks-table thead th { background: rgba(51, 65, 85, 0.5); padding: 14px 18px; text-align: left; font-size: 0.72rem; font-weight: 700; color: #cbd5e1; text-transform: uppercase; letter-spacing: 0.8px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
        .tasks-table tbody td { padding: 15px 18px; font-size: 0.88rem; color: #e2e8f0; }
        .tasks-table tbody tr:hover { background: rgba(99, 102, 241, 0.08); }
        .tasks-table .row-index { width: 48px; text-align: center; color: #475569; font-size: 0.75rem; font-weight: 600; font-family: 'Fira Code', monospace; }
        .tasks-table .task-name { font-weight: 600; color: #f1f5f9; }
    </style>
</head>
<body>
    <nav class="top-navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-brand">
                <span class="logo-icon">🚀</span><span class="logo-text">Hermes</span><span class="version">v3.0 · public demo</span>
            </a>
            <div class="navbar-menu">
                <a href="index.html" class="nav-item"><span class="icon">&#x1F5A5;</span><span>端口状态</span></a>
                <a href="agents.html" class="nav-item"><span class="icon">&#x1F916;</span><span>Agent</span></a>
                <a href="tasks.html" class="nav-item"><span class="icon">&#x23F0;</span><span>定时任务</span></a>
                <a href="skills.html" class="nav-item"><span class="icon">&#x26A1;</span><span>技能</span></a>
                <a href="pipeline.html" class="nav-item"><span class="icon">&#x1F9ED;</span><span>流水线</span></a>
                <a href="token.html" class="nav-item active"><span class="icon">&#x1FA99;</span><span>Token</span></a>
                <a href="memory.html" class="nav-item"><span class="icon">&#x1F9E0;</span><span>记忆图谱</span></a>
            </div>
            <div class="navbar-actions">
                <button class="search-trigger" onclick="alert('🔒 Demo 模式')"><span>🔍</span><span>搜索...</span><kbd>⌘K</kbd></button>
                <button class="bookmark-btn" onclick="toggleBookmark()" title="收藏页面">⭐</button>
                <button class="mobile-menu-btn" onclick="toggleMobileMenu()"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <div class="container page-content">
        <header class="header">
            <h1>Token 统计</h1>
            <p class="subtitle">模型用量 · 调用分析 · 趋势图表</p>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="app.refreshAll()">刷新</button>
            </div>
        </header>

        <div class="stats-grid" id="tokenStatsGrid"></div>

        <div class="charts-row">
            <div class="chart-panel">
                <div class="panel-title"><span class="title-icon">📈</span> 7 日趋势 (demo)</div>
                <div style="padding:40px 20px;text-align:center;color:#64748b;">
                    <div style="font-size:3rem;margin-bottom:12px;">📊</div>
                    <div style="font-size:0.9rem;">Chart.js 图表在静态演示版中需要 CDN。<br>此处显示 demo 数据表格。</div>
                </div>
            </div>
            <div class="chart-panel">
                <div class="panel-title"><span class="title-icon">🤖</span> 模型分布</div>
                <div class="model-list" id="modelList"></div>
            </div>
        </div>

        <div class="chart-panel">
            <div class="panel-title"><span class="title-icon">🔥</span> 热门会话</div>
            <div id="topSessions"></div>
        </div>
    </div>

    <div class="toast" id="toast"><span class="toast-message" id="toastMessage"></span></div>

    <script src="sample-data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
